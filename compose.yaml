services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meaworld
      POSTGRES_USER: meaworld
      POSTGRES_PASSWORD: local-only-meaworld
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meaworld -d meaworld"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - meaworld-postgres:/var/lib/postgresql/data

volumes:
  meaworld-postgres:
